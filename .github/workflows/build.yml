name: Build Jelly Jump Web Lens

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build static Lens
        run: npm run build
      - name: Package Web Lens
        run: npm run pack
      - name: Verify production output
        run: npm run verify
      - name: Upload Lens ZIP
        uses: actions/upload-artifact@v4
        with:
          name: my-web-lens
          path: my-web-lens.zip
          if-no-files-found: error
